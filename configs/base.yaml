seed: 42
data:
  root: data/raw
  manifest: data/splits.csv
  field_set: data/field_set
  split:
    train: 0.70
    val: 0.15
    test: 0.15
  image_size: 224
  batch_size: 32
  num_workers: 2
model:
  backbone: efficientnet_b0
  pretrained: true
  dropout: 0.3
loss:
  label_smoothing: 0.1
  use_class_weights: true
phase1:
  epochs: 10
  lr: 1.0e-3
phase2:
  epochs: 15
  unfreeze_fraction: 0.25
  lr_backbone: 1.0e-5
  lr_head: 1.0e-4
  early_stopping_patience: 5
inference:
  top_k: 3
  confidence_threshold: 0.6
